</footer>

<script src="js/grupo-saneas.js"></script>
<script>
  /* Grupo Saneas: el mismo componente en todas las casas del grupo. */
  GrupoSaneas.init({
    actual: 'salimos',
    logos: 'img/',
    barra: '.cabecera',
    extras: [{
      id: 'academia', nombre: 'Academia Saneas', url: 'https://saneas.es/academia',
      logo: 'app-asesorias.png', tipo: 'un programa',
      texto: 'Si te gusta el mundo de la nutrición, ahora tú también puedes. Más fácil que nunca.'
    }]
  });
  document.querySelectorAll('.grupo-pie').forEach(function (p) { p.innerHTML = GrupoSaneas.gridHTML(); });
  /* Contador del grupo: solo fuera de este Mac, para no contar las pruebas. */
  if (!/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
    var t = document.createElement('script'); t.src = 'js/telemetria.js'; document.body.appendChild(t);
  }
</script>
<script src="vendor/supabase.js"></script>
